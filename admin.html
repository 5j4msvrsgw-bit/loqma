<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123b2d">
<title>لُقمة | لوحة الإدارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--g:#123b2d;--g2:#1d6048;--gold:#c6a66b;--bg:#f4f5ef;--paper:#fffefa;--ink:#1c2922;--muted:#7e8981;--line:#e5e8df;--red:#a23f35}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,sans-serif}button,input,select{font:inherit}button{cursor:pointer}[hidden]{display:none!important}
header{background:linear-gradient(135deg,#0d281f,#1d6048);color:#fff;padding:18px 15px;border-radius:0 0 22px 22px}
.wrap{max-width:1100px;margin:auto;padding:0 14px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:25px;font-weight:900}.brand small{display:block;font-size:10px;color:#e6d5af;letter-spacing:1px}.muted{color:var(--muted);font-size:11px}.header-actions{display:flex;gap:7px}.header-actions button{border:1px solid #ffffff55;background:#ffffff18;color:#fff;padding:8px 12px;border-radius:10px;font-size:11px}
main{padding:18px 0 50px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 5px 18px #123b2d08}
h1,h2,h3,p{margin-top:0}.heading{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.heading h2{font-size:17px;margin:0}
.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tab{border:1px solid var(--line);background:#fff;color:var(--g);border-radius:10px;padding:9px 13px;white-space:nowrap;font-size:11px;font-weight:800}.tab.active{background:var(--g);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}.stat{background:#f0f5ef;border:1px solid #e1eade;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:21px;color:var(--g)}.stat span{font-size:10px;color:var(--muted)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:12px 0}.field{width:100%;border:1px solid #dce3d9;border-radius:10px;background:#fff;padding:10px;font-size:12px;min-width:0}
.btn{border:0;border-radius:10px;padding:9px 13px;font-size:11px;font-weight:800;background:var(--g);color:#fff}.btn.secondary{background:#edf3ed;color:var(--g);border:1px solid #dce8dc}.btn.danger{background:#f8eae7;color:#91372e;border:1px solid #efd5cf}.btn:disabled{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.order{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin:9px 0}.order-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.order-head strong{color:var(--g);font-size:13px}.badge{display:inline-block;background:#edf3ed;color:var(--g);padding:4px 9px;border-radius:20px;font-size:10px;font-weight:800}
.order p{font-size:11px;line-height:1.9;margin:5px 0}.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:9px}.actions select{max-width:220px}
.notice{background:#eef4ed;border:1px solid #dfe9dc;color:var(--g);border-radius:11px;padding:10px;font-size:11px;line-height:1.9;margin:10px 0}
.empty,.error{background:#fff;border:1px dashed var(--line);padding:22px;text-align:center;border-radius:12px;color:var(--muted);font-size:12px;line-height:2}.error{color:#9a3d33}
.login{min-height:100dvh;display:grid;place-items:center;padding:18px}.login-card{width:100%;max-width:420px;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 12px 34px #123b2d12}.login-card h1{font-size:22px;color:var(--g);margin:5px 0}.login-card p{font-size:12px;color:var(--muted);line-height:2}.login-card input{width:100%;direction:ltr;text-align:left;border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0 12px}.login-card button{width:100%}.msg{font-size:11px;color:var(--g);line-height:1.8;margin-top:10px;overflow-wrap:anywhere}
@media(max-width:620px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.stats{grid-template-columns:repeat(2,1fr)}.brand{font-size:22px}}
@media print{body{background:#fff}.no-print,header,.tabs{display:none!important}.wrap{max-width:none;padding:0}.panel{border:0;box-shadow:none}.order{break-inside:avoid}.print-title{text-align:center}}
</style>
</head>
<body>
<section class="login" id="login-screen">
 <div class="login-card">
  <div style="font-size:40px">🥖</div><h1>لوحة إدارة لُقمة</h1>
  <p>سجّل الدخول بالبريد الإلكتروني المصرّح له كمدير. لن يتم عرض بيانات الإدارة إلا للحساب المسجل في صلاحيات المدير.</p>
  <form id="login-form"><input id="email" type="email" placeholder="name@example.com" autocomplete="email" required><button class="btn" id="login-btn">إرسال رابط الدخول</button></form>
  <div class="msg" id="login-msg" aria-live="polite"></div>
 </div>
</section>
<div id="admin-app" hidden>
<header><div class="wrap top"><div class="brand">لُقمة.<small>لوحة الإدارة والتشغيل</small></div><div class="header-actions"><button id="refresh">تحديث</button><button id="logout">تسجيل الخروج</button></div></div></header>
<main class="wrap">
 <section class="panel">
  <div class="heading"><h2 id="page-title">إدارة الطلبات</h2><span class="muted" id="admin-email"></span></div>
  <div class="tabs no-print">
   <button class="tab active" data-tab="orders">الطلبات</button>
   <button class="tab" data-tab="delivery">توزيع التوصيل</button>
   <button class="tab" data-tab="drivers">المندوبون</button>
  </div>
  <div id="content"><div class="empty">جاري تحميل لوحة الإدارة…</div></div>
 </section>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
<script>
"use strict";
const SUPABASE_URL="https://dvidxumpkgthubassfxm.supabase.co";
const SUPABASE_KEY="sb_publishable_d5hFIWk_aLxzsF2WZt7uvg_iHZCESFs";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=p=>(Number(p||0)/100).toFixed(2)+" ج";
const labels={pending:"قيد المراجعة",confirmed:"تم التأكيد",preparing:"قيد التجهيز",ready_for_pickup:"جاهز للمندوب",out_for_delivery:"خرج للتوصيل",delivered:"تم التسليم",cancelled:"ملغي",assigned:"تم التعيين",picked_up:"استلمها المندوب",failed:"تعذر التسليم"};
let user=null,staff=null,tab="orders",orders=[],jobs=[],drivers=[],profiles={},addresses={},itemsByOrder={};
function setMessage(id,msg){$(id).textContent=msg}
function showApp(on){$("login-screen").hidden=on;$("admin-app").hidden=!on}
async function checkAdmin(){
 const {data,error}=await sb.from("staff_members").select("user_id,role,is_active").eq("user_id",user.id).eq("role","admin").eq("is_active",true).maybeSingle();
 if(error)throw error;if(!data)throw new Error("هذا الحساب ليس لديه صلاحية مدير نشطة.");
 staff=data;
}
async function signIn(){
 const email=$("email").value.trim();$("login-btn").disabled=true;setMessage("login-msg","جاري إرسال رابط الدخول…");
 const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split("#")[0]}});
 setMessage("login-msg",error?"تعذر إرسال الرابط: "+error.message:"تم إرسال رابط الدخول إلى بريدك. افتحه من نفس الجهاز للعودة إلى لوحة الإدارة.");
 $("login-btn").disabled=false;
}
$("login-form").addEventListener("submit",e=>{e.preventDefault();signIn()});
async function startSession(session){
 user=session?.user||null;
 if(!user){showApp(false);return}
 try{await checkAdmin();showApp(true);$("admin-email").textContent=user.email||"";await loadTab()}
 catch(e){showApp(false);setMessage("login-msg",e.message||"تعذر التحقق من صلاحية المدير.");}
}
sb.auth.onAuthStateChange((event,session)=>{if(event==="INITIAL_SESSION"||event==="SIGNED_IN"||event==="TOKEN_REFRESHED"||event==="SIGNED_OUT")setTimeout(()=>startSession(session),0)});
$("logout").onclick=async()=>{await sb.auth.signOut();user=null;staff=null;showApp(false)};
$("refresh").onclick=()=>loadTab();
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;tab=b.dataset.tab;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));loadTab()});
async function loadTab(){
 $("page-title").textContent=tab==="orders"?"إدارة الطلبات":tab==="delivery"?"توزيع مهام التوصيل":"إدارة المندوبين";
 $("content").innerHTML='<div class="empty">جاري تحميل البيانات…</div>';
 if(tab==="orders")return loadOrders();
 if(tab==="delivery")return loadDelivery();
 return loadDrivers();
}
async function fetchDetails(orderRows){
 const uids=[...new Set(orderRows.map(o=>o.customer_id).filter(Boolean))],aids=[...new Set(orderRows.map(o=>o.address_id).filter(Boolean))],oids=orderRows.map(o=>o.id);
 const [pr,ar,ir]=await Promise.all([
  uids.length?sb.from("profiles").select("user_id,full_name,phone").in("user_id",uids):Promise.resolve({data:[],error:null}),
  aids.length?sb.from("addresses").select("id,area,street,building,floor,apartment,landmark").in("id",aids):Promise.resolve({data:[],error:null}),
  oids.length?sb.from("order_items").select("order_id,product_name,quantity,line_total_piasters").in("order_id",oids):Promise.resolve({data:[],error:null})
 ]);
 if(pr.error)throw pr.error;if(ar.error)throw ar.error;if(ir.error)throw ir.error;
 profiles=Object.fromEntries((pr.data||[]).map(x=>[x.user_id,x]));addresses=Object.fromEntries((ar.data||[]).map(x=>[x.id,x]));
 itemsByOrder=(ir.data||[]).reduce((acc,x)=>{(acc[x.order_id]??=[]).push(x);return acc},{});
}
function addressText(a){return [a?.area,a?.street,a?.building&&"عمارة "+a.building,a?.floor&&"دور "+a.floor,a?.apartment&&"شقة "+a.apartment,a?.landmark].filter(Boolean).join(" - ")||"غير متاح"}
function orderCard(o,showDispatch=false){
 const p=profiles[o.customer_id]||{},a=addresses[o.address_id]||{},items=itemsByOrder[o.id]||[];
 return '<article class="order"><div class="order-head"><label><input type="checkbox" class="order-check" value="'+esc(o.id)+'"> <strong>طلب #'+esc(o.order_number||o.id)+'</strong></label><span class="badge">'+(labels[o.status]||esc(o.status))+'</span></div>'+
 '<p><b>'+esc(p.full_name||"عميل بدون اسم")+'</b> • <a href="tel:'+esc(p.phone||"")+'">'+esc(p.phone||"بدون رقم")+'</a></p>'+
 '<p>العنوان: '+esc(addressText(a))+'</p><p>التوصيل: '+esc(o.delivery_date||"—")+' • الإجمالي: '+money(o.total_amount_piasters)+'</p>'+
 '<p>الأصناف: '+(items.map(x=>esc(x.product_name)+" × "+x.quantity).join("، ")||"—")+'</p>'+
 '<div class="actions no-print"><select class="field" data-status-for="'+esc(o.id)+'">'+Object.entries({pending:"قيد المراجعة",confirmed:"تم التأكيد",preparing:"قيد التجهيز",ready_for_pickup:"جاهز للمندوب",out_for_delivery:"خرج للتوصيل",delivered:"تم التسليم",cancelled:"ملغي"}).map(([v,l])=>'<option value="'+v+'" '+(o.status===v?"selected":"")+'>'+l+'</option>').join("")+'</select><button class="btn secondary" data-print-order="'+esc(o.id)+'">طباعة الطلب</button></div></article>';
}
async function loadOrders(){
 try{
  const {data,error}=await sb.from("orders").select("*").order("created_at",{ascending:false}).limit(300);if(error)throw error;orders=data||[];await fetchDetails(orders);
  const counts={pending:0,preparing:0,ready_for_pickup:0,out_for_delivery:0,delivered:0,cancelled:0};orders.forEach(o=>counts[o.status]=(counts[o.status]||0)+1);
  $("content").innerHTML='<div class="stats">'+[["كل الطلبات",orders.length],["جديدة",counts.pending],["قيد التجهيز",counts.preparing],["جاهز للمندوب",counts.ready_for_pickup],["خرجت للتوصيل",counts.out_for_delivery],["تم التسليم",counts.delivered]].map(x=>'<div class="stat"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join("")+'</div>'+
  '<div class="filters no-print"><input class="field" id="order-search" placeholder="بحث برقم الطلب أو اسم العميل أو الهاتف أو العنوان"><select class="field" id="order-filter"><option value="all">كل الحالات</option>'+Object.entries(labels).filter(([v])=>["pending","confirmed","preparing","ready_for_pickup","out_for_delivery","delivered","cancelled"].includes(v)).map(([v,l])=>'<option value="'+v+'">'+l+'</option>').join("")+'</select><input class="field" type="date" id="order-date"></div>'+
  '<div class="toolbar no-print"><button class="btn secondary" id="select-visible">تحديد الظاهر</button><button class="btn" id="print-selected">طباعة المحدد A4</button><button class="btn secondary" id="print-results">طباعة نتائج البحث</button></div><div id="orders-list"></div>';
  const filtered=()=>{const q=($("order-search").value||"").trim().toLowerCase(),s=$("order-filter").value,d=$("order-date").value;return orders.filter(o=>{const p=profiles[o.customer_id]||{},a=addresses[o.address_id]||{},hay=[o.order_number,o.id,p.full_name,p.phone,addressText(a)].join(" ").toLowerCase();return(!q||hay.includes(q))&&(s==="all"||o.status===s)&&(!d||o.delivery_date===d)})};
  const render=()=>{$("orders-list").innerHTML=filtered().map(orderCard).join("")||'<div class="empty">لا توجد طلبات مطابقة.</div>';bindOrderActions()};
  ["order-search","order-filter","order-date"].forEach(id=>$(id).addEventListener("input",render));
  $("select-visible").onclick=()=>document.querySelectorAll(".order-check").forEach(x=>x.checked=true);
  $("print-selected").onclick=()=>printOrders(orders.filter(o=>[...document.querySelectorAll(".order-check:checked")].some(x=>x.value===o.id)));
  $("print-results").onclick=()=>printOrders(filtered());
  render();
 }catch(e){$("content").innerHTML='<div class="error">تعذر تحميل الطلبات: '+esc(e.message)+'</div>'}
}
function bindOrderActions(){
 document.querySelectorAll("[data-status-for]").forEach(s=>s.onchange=async()=>{const id=s.dataset.statusFor;if(!confirm("تأكيد تغيير حالة الطلب؟")){s.value=orders.find(o=>o.id===id)?.status||"pending";return}const {error}=await sb.from("orders").update({status:s.value,updated_at:new Date().toISOString()}).eq("id",id);if(error){alert("تعذر تحديث الحالة: "+error.message);return}await loadOrders()});
 document.querySelectorAll("[data-print-order]").forEach(b=>b.onclick=()=>printOrders(orders.filter(o=>o.id===b.dataset.printOrder)));
}
function printOrders(rows){
 if(!rows.length){alert("حدد طلبًا واحدًا على الأقل.");return}
 const body=rows.map(o=>{const p=profiles[o.customer_id]||{},a=addresses[o.address_id]||{},it=itemsByOrder[o.id]||[];return '<section class="ticket"><b>طلب رقم: '+esc(o.order_number||o.id)+'</b><br>العميل: '+esc(p.full_name||"—")+'<br>الموبايل: '+esc(p.phone||"—")+'<br>العنوان: '+esc(addressText(a))+'<br>موعد التوصيل: '+esc(o.delivery_date||"—")+'<hr>'+it.map(x=>esc(x.product_name)+" × "+x.quantity+" — "+money(x.line_total_piasters)).join("<br>")+'<hr><b>الإجمالي: '+money(o.total_amount_piasters)+'</b><br>الحالة: '+(labels[o.status]||esc(o.status))+'</section>'}).join("");
 printPage("لُقمة — كشف الطلبات",body);
}
function printPage(title,body){
 const w=window.open("","_blank");if(!w){alert("اسمح بفتح النوافذ المنبثقة للطباعة.");return}
 w.document.write('<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>body{font-family:Arial,Tahoma,sans-serif;padding:12mm;color:#111}h2{text-align:center}.ticket{border-bottom:1px dashed #888;padding:12px 0;break-inside:avoid;line-height:1.9;font-size:13px}@media print{.ticket{page-break-inside:avoid}}</style></head><body><h2>'+esc(title)+'</h2>'+body+'<script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>');w.document.close();
}
async function loadDrivers(){
 try{
  const [sr,allStaff,pr]=await Promise.all([sb.from("staff_members").select("user_id,role,is_active").eq("role","driver").order("created_at",{ascending:false}),sb.from("staff_members").select("user_id,role,is_active"),sb.from("profiles").select("user_id,full_name,phone")]);
  if(sr.error)throw sr.error;if(allStaff.error)throw allStaff.error;if(pr.error)throw pr.error;drivers=sr.data||[];const existingStaff=new Set((allStaff.data||[]).map(x=>x.user_id));const ps=Object.fromEntries((pr.data||[]).map(p=>[p.user_id,p]));
  $("content").innerHTML='<div class="panel"><h3>إضافة مندوب من حساب مسجل</h3><div class="notice">المندوب يسجل في تطبيق لُقمة أولًا، ثم ابحث برقم الموبايل المسجل وأضفه من هنا.</div><div class="filters"><input class="field" id="driver-phone" inputmode="tel" placeholder="رقم الموبايل المسجل"><button class="btn" id="find-driver">بحث</button></div><div id="driver-candidates"></div></div>'+
  (drivers.map(d=>{const p=ps[d.user_id]||{};return '<article class="order"><b>'+esc(p.full_name||"مندوب بدون اسم")+'</b> • '+esc(p.phone||"بدون رقم")+'<p class="muted">'+(d.is_active?"حساب نشط":"حساب موقوف")+'</p><button class="btn '+(d.is_active?"danger":"secondary")+'" data-toggle-driver="'+esc(d.user_id)+'" data-active="'+d.is_active+'">'+(d.is_active?"إيقاف المندوب":"إعادة تفعيل المندوب")+'</button></article>'}).join("")||'<div class="empty">لا يوجد مندوبون حتى الآن.</div>');
  $("find-driver").onclick=async()=>{const phone=$("driver-phone").value.trim().replace(/\s+/g,"");if(phone.length<6){alert("اكتب رقم موبايل صحيحًا.");return}const {data,error}=await sb.from("profiles").select("user_id,full_name,phone").ilike("phone","%"+phone+"%").limit(10);if(error){$("driver-candidates").innerHTML='<div class="error">'+esc(error.message)+'</div>';return}const found=(data||[]).filter(p=>!existingStaff.has(p.user_id));$("driver-candidates").innerHTML=found.length?found.map(p=>'<div class="order"><b>'+esc(p.full_name||"بدون اسم")+'</b> • '+esc(p.phone||"بدون رقم")+'<br><button class="btn" data-add-driver="'+esc(p.user_id)+'">إضافة كمندوب</button></div>').join(""):'<div class="empty">لم يتم العثور على حساب جديد بهذا الرقم. تأكد أن العميل سجل في التطبيق.</div>';document.querySelectorAll("[data-add-driver]").forEach(b=>b.onclick=async()=>{b.disabled=true;const {error}=await sb.from("staff_members").insert({user_id:b.dataset.addDriver,role:"driver",is_active:true,created_by:user.id});if(error){alert("تعذر إضافة المندوب: "+error.message);b.disabled=false}else{alert("تمت إضافة المندوب.");await loadDrivers()}})};
  document.querySelectorAll("[data-toggle-driver]").forEach(b=>b.onclick=async()=>{const active=b.dataset.active!=="true";if(!confirm(active?"إعادة تفعيل المندوب؟":"إيقاف المندوب؟"))return;const {error}=await sb.from("staff_members").update({is_active:active,updated_at:new Date().toISOString()}).eq("user_id",b.dataset.toggleDriver).eq("role","driver");if(error)alert("تعذر تحديث المندوب: "+error.message);else await loadDrivers()});
 }catch(e){$("content").innerHTML='<div class="error">تعذر تحميل المندوبين: '+esc(e.message)+'</div>'}
}
async function loadDelivery(){
 try{
  const [jr,dr]=await Promise.all([sb.from("delivery_jobs").select("id,order_id,status,assigned_driver_id,created_at").order("created_at",{ascending:false}).limit(300),sb.from("staff_members").select("user_id,is_active").eq("role","driver")]);
  if(jr.error)throw jr.error;if(dr.error)throw dr.error;jobs=jr.data||[];const driverRows=dr.data||[],orderIds=[...new Set(jobs.map(j=>j.order_id))],driverIds=driverRows.map(d=>d.user_id);
  const [or,pr]=await Promise.all([orderIds.length?sb.from("orders").select("id,order_number,delivery_date,customer_id,address_id,status,total_amount_piasters").in("id",orderIds):Promise.resolve({data:[],error:null}),driverIds.length?sb.from("profiles").select("user_id,full_name,phone").in("user_id",driverIds):Promise.resolve({data:[],error:null})]);
  if(or.error)throw or.error;if(pr.error)throw pr.error;const os=or.data||[];await fetchDetails(os);const om=Object.fromEntries(os.map(o=>[o.id,o])),dp=Object.fromEntries((pr.data||[]).map(p=>[p.user_id,p]));
  const driverName=id=>{const p=dp[id]||{},d=driverRows.find(x=>x.user_id===id);return (p.full_name||p.phone||"مندوب")+(d&&!d.is_active?" (موقوف)":"")};
  const counts={pending:0,assigned:0,picked_up:0,delivered:0,failed:0,cancelled:0};jobs.forEach(j=>counts[j.status]=(counts[j.status]||0)+1);
  $("content").innerHTML='<div class="stats">'+[["كل المهام",jobs.length],["بانتظار التعيين",counts.pending],["تم التعيين",counts.assigned],["استلمها المندوب",counts.picked_up],["تم التسليم",counts.delivered],["تعذر التسليم",counts.failed]].map(x=>'<div class="stat"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join("")+'</div>'+
  '<div class="notice">عيّن الطلب لمندوب نشط. بعد التعيين سيظهر للمندوب في حسابه، ويمكنه تحديث حالة الاستلام والتسليم.</div>'+
  '<div class="filters no-print"><input class="field" id="delivery-search" placeholder="بحث برقم الطلب أو العميل أو الهاتف أو العنوان"><select class="field" id="delivery-filter"><option value="all">كل الحالات</option>'+Object.entries({pending:"بانتظار التعيين",assigned:"تم التعيين",picked_up:"استلمها المندوب",delivered:"تم التسليم",failed:"تعذر التسليم",cancelled:"ملغي"}).map(([v,l])=>'<option value="'+v+'">'+l+'</option>').join("")+'</select><input class="field" id="delivery-date" type="date"></div>'+
  '<div class="toolbar no-print"><button class="btn secondary" id="print-delivery">طباعة كشف التوصيل</button></div><div id="delivery-list"></div>';
  const filtered=()=>{const q=$("delivery-search").value.trim().toLowerCase(),s=$("delivery-filter").value,d=$("delivery-date").value;return jobs.filter(j=>{const o=om[j.order_id]||{},p=profiles[o.customer_id]||{},a=addresses[o.address_id]||{},hay=[o.order_number,p.full_name,p.phone,addressText(a)].join(" ").toLowerCase();return(!q||hay.includes(q))&&(s==="all"||j.status===s)&&(!d||o.delivery_date===d)})};
  const render=()=>{$("delivery-list").innerHTML=filtered().map(j=>{const o=om[j.order_id]||{},p=profiles[o.customer_id]||{},a=addresses[o.address_id]||{},it=itemsByOrder[o.id]||[],opts=driverRows.map(d=>'<option value="'+esc(d.user_id)+'" '+(d.user_id===j.assigned_driver_id?"selected":"")+' '+(!d.is_active?"disabled":"")+'>'+esc(driverName(d.user_id))+'</option>').join("");return '<article class="order"><div class="order-head"><strong>طلب #'+esc(o.order_number||o.id||j.order_id)+'</strong><span class="badge">'+(labels[j.status]||esc(j.status))+'</span></div><p><b>'+esc(p.full_name||"عميل بدون اسم")+'</b> • <a href="tel:'+esc(p.phone||"")+'">'+esc(p.phone||"بدون رقم")+'</a></p><p>العنوان: '+esc(addressText(a))+'</p><p>التوصيل: '+esc(o.delivery_date||"—")+' • الإجمالي: '+money(o.total_amount_piasters)+'</p><p>الأصناف: '+it.map(x=>esc(x.product_name)+" × "+x.quantity).join("، ")+'</p><p>المندوب الحالي: '+(j.assigned_driver_id?esc(driverName(j.assigned_driver_id)):"غير معين")+'</p><div class="actions no-print"><select class="field" data-driver-select="'+esc(j.id)+'"><option value="">اختار المندوب</option>'+opts+'</select><button class="btn" data-assign="'+esc(j.id)+'" '+(["delivered","cancelled"].includes(j.status)?"disabled":"")+'>تعيين / تغيير</button></div></article>'}).join("")||'<div class="empty">لا توجد مهام توصيل مطابقة.</div>';
   document.querySelectorAll("[data-assign]").forEach(b=>b.onclick=async()=>{const sel=document.querySelector('[data-driver-select="'+CSS.escape(b.dataset.assign)+'"]'),driverId=sel?.value;if(!driverId){alert("اختار مندوبًا نشطًا.");return}b.disabled=true;const {error}=await sb.rpc("loqma_admin_assign_delivery_driver",{p_job_id:b.dataset.assign,p_driver_id:driverId,p_note:null});if(error){alert("تعذر التعيين: "+error.message);b.disabled=false}else await loadDelivery()});
  };
  ["delivery-search","delivery-filter","delivery-date"].forEach(id=>$(id).addEventListener("input",render));
  $("print-delivery").onclick=()=>{const rows=filtered();if(!rows.length){alert("لا توجد مهام للطباعة.");return}const body=rows.map(j=>{const o=om[j.order_id]||{},p=profiles[o.customer_id]||{},a=addresses[o.address_id]||{},it=itemsByOrder[o.id]||[];return '<section class="ticket"><b>طلب #'+esc(o.order_number||o.id||j.order_id)+'</b><br>المندوب: '+esc(j.assigned_driver_id?driverName(j.assigned_driver_id):"غير معين")+'<br>العميل: '+esc(p.full_name||"—")+'<br>الهاتف: '+esc(p.phone||"—")+'<br>العنوان: '+esc(addressText(a))+'<br>موعد التوصيل: '+esc(o.delivery_date||"—")+'<br>الأصناف: '+it.map(x=>esc(x.product_name)+" × "+x.quantity).join("، ")+'<br>الحالة: '+(labels[j.status]||esc(j.status))+'</section>'}).join("");printPage("لُقمة — كشف التوصيل",body)};
  render();
 }catch(e){$("content").innerHTML='<div class="error">تعذر تحميل مهام التوصيل: '+esc(e.message)+'</div>'}
}
(async()=>{const {data,error}=await sb.auth.getSession();if(error){setMessage("login-msg",error.message);return}await startSession(data.session)})();
</script>
