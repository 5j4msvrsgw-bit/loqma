
name: Build Loqma Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html admin.html manifest.json sw.js www/
          cp -r *.png *.jpg *.jpeg *.webp *.svg www/ 2>/dev/null || true
          cp -r assets www/assets

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@^8 @capacitor/cli@^8 @capacitor/android@^8 @capacitor/app@^8 @capacitor/browser@^8

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.loqma.app",
            "appName": "لُقمة",
            "webDir": "www"
          }
          EOF

      - name: Add Android
        run: npx cap add android

      - name: Configure Android OAuth deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          intent = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="com.loqma.app" android:host="auth-callback" />
                  </intent-filter>
          '''
          if 'android:scheme="com.loqma.app"' not in s:
              pos = s.find("</activity>")
              if pos < 0:
                  raise SystemExit("Android activity tag not found")
              s = s[:pos] + intent + "\n        " + s[pos:]
              p.write_text(s)
          PY

      - name: Generate Android launcher icons from Loqma logo
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          src = Image.open("assets/loqma-logo.webp.PNG").convert("RGBA")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in sizes.items():
              outdir = Path("android/app/src/main/res") / folder
              outdir.mkdir(parents=True, exist_ok=True)
              canvas = Image.new("RGBA", (size, size), (255, 250, 240, 255))
              logo = src.copy()
              logo.thumbnail((int(size * 0.82), int(size * 0.82)), Image.Resampling.LANCZOS)
              canvas.alpha_composite(logo, ((size-logo.width)//2, (size-logo.height)//2))
              canvas.convert("RGB").save(outdir / "ic_launcher.png", quality=95)
              canvas.convert("RGB").save(outdir / "ic_launcher_round.png", quality=95)
          PY

      - name: Sync Android
        run: npx cap sync android

      - name: Set Android version from workflow run
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i -E "s/versionName ['\"][^'\"]+['\"]/versionName '1.0.${GITHUB_RUN_NUMBER}'/" android/app/build.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: loqma-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
